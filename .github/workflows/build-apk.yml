name: FANEVA SYSTEM - Build APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config libffi-dev libssl-dev zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Run FANEVA tests
        run: |
          python -m unittest test_canonical_stock_views.py test_ai_data_service.py test_faneva_ia.py test_faneva_ia_security.py test_faneva_ia_ui.py -v 2>&1 | tee test.log
          grep -q "Ran 117 tests" test.log
          grep -q "^OK" test.log

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          yes | buildozer android release

      - name: Verify APK
        run: |
          APK=$(find bin -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FANEVA_SYSTEM_1.4.9.16_APK
          path: bin/*.apk
          if-no-files-found: error
